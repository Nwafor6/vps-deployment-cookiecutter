name: Deploy to EC2 - {{cookiecutter.environment | capitalize}}

on:
  push:
    branches:
      - main

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: {% raw %}${{ secrets.DOCKERHUB_USERNAME }}{% endraw %}
          password: {% raw %}${{ secrets.DOCKERHUB_TOKEN }}{% endraw %}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: {% raw %}${{ secrets.DOCKERHUB_USERNAME }}{% endraw %}/{{cookiecutter.project_slug}}:dev,{% raw %}${{ secrets.DOCKERHUB_USERNAME }}{% endraw %}/{{cookiecutter.project_slug}}:{% raw %}${{ github.sha }}{% endraw %}
          cache-from: type=registry,ref={% raw %}${{ secrets.DOCKERHUB_USERNAME }}{% endraw %}/{{cookiecutter.project_slug}}:buildcache
          cache-to: type=registry,ref={% raw %}${{ secrets.DOCKERHUB_USERNAME }}{% endraw %}/{{cookiecutter.project_slug}}:buildcache,mode=max

  update-environment:
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Clean up stale files on server
        uses: appleboy/ssh-action@master
        with:
          host: {% raw %}${{ secrets.VPS_HOST }}{% endraw %}
          username: {% raw %}${{ secrets.VPS_USERNAME }}{% endraw %}
          key: {% raw %}${{ secrets.SSH_PRIVATE_KEY }}{% endraw %}
          script: |
            rm -rf docker-compose.{{cookiecutter.environment}}.yml Caddyfile.{{cookiecutter.environment}}
            echo "Cleanup done"

      - name: Copy deployment files to server
        uses: appleboy/scp-action@master
        with:
          host: {% raw %}${{ secrets.VPS_HOST }}{% endraw %}
          username: {% raw %}${{ secrets.VPS_USERNAME }}{% endraw %}
          key: {% raw %}${{ secrets.SSH_PRIVATE_KEY }}{% endraw %}
          source: "docker-compose.{{cookiecutter.environment}}.yml,Caddyfile.{{cookiecutter.environment}}"
          target: "./"

      - name: Update Environment Variables on Server
        uses: appleboy/ssh-action@master
        with:
          host: {% raw %}${{ secrets.VPS_HOST }}{% endraw %}
          username: {% raw %}${{ secrets.VPS_USERNAME }}{% endraw %}
          key: {% raw %}${{ secrets.SSH_PRIVATE_KEY }}{% endraw %}
          script: |
            echo "Creating .env.{{cookiecutter.project_slug}}.{{cookiecutter.environment}} file on server"
            cat <<EOF > .env.{{cookiecutter.project_slug}}.{{cookiecutter.environment}}
            DOCKER_IMAGE={% raw %}${{ secrets.DOCKERHUB_USERNAME }}{% endraw %}/{{cookiecutter.project_slug}}:dev
            
            # ==========================================
            # ⬇️ ADD YOUR CUSTOM ENVIRONMENT VARIABLES ⬇️
            # ==========================================
            # Map your GitHub Secrets to your server's .env file here:
            # THIRD_PARTY_API_KEY={% raw %}${{ secrets.THIRD_PARTY_API_KEY }}{% endraw %}
            EOF
            
            {% if cookiecutter.use_pgbouncer == 'y' %}
            # Parse DATABASE_URL for PgBouncer and update .env
            cat <<PY_SCRIPT > parse_db_url.py
            import os
            from urllib.parse import urlparse
            
            url_str = "{% raw %}${{ secrets.DATABASE_URL }}{% endraw %}"
            if url_str:
                url = urlparse(url_str)
                print(f"DB_USER={url.username}")
                print(f"DB_PASSWORD={url.password}")
                print(f"DB_HOST={url.hostname}")
                print(f"DB_PORT={url.port or 5432}")
                print(f"DB_NAME={url.path[1:]}")
                # Construct the new DATABASE_URL pointing to pgbouncer service
                print(f"DATABASE_URL=postgres://{url.username}:{url.password}@pgbouncer:5432/{url.path[1:]}")
            PY_SCRIPT
            
            python3 parse_db_url.py >> .env.{{cookiecutter.project_slug}}.{{cookiecutter.environment}}
            rm parse_db_url.py
            {% else %}
            echo "DATABASE_URL={% raw %}${{ secrets.DATABASE_URL }}{% endraw %}" >> .env.{{cookiecutter.project_slug}}.{{cookiecutter.environment}}
            {% endif %}
            
            echo "Environment variables update completed"

  deploy-docker:
    runs-on: ubuntu-latest
    needs: [update-environment]
    steps:
      - name: Deploy and restart Docker containers
        uses: appleboy/ssh-action@master
        with:
          host: {% raw %}${{ secrets.VPS_HOST }}{% endraw %}
          username: {% raw %}${{ secrets.VPS_USERNAME }}{% endraw %}
          key: {% raw %}${{ secrets.SSH_PRIVATE_KEY }}{% endraw %}
          script: |
            # Stop and disable legacy systemd services to prevent conflicts
            echo "Stopping legacy systemd services..."
            sudo systemctl stop daphne celery celerybeat pgbouncer || true
            sudo systemctl disable daphne celery celerybeat pgbouncer || true

            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              echo "Docker not found, installing..."
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg lsb-release
              sudo mkdir -p /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg --yes
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo systemctl enable docker
              sudo systemctl start docker
              sudo usermod -aG docker $USER
            fi

            # Bootstrap Global Caddy Gateway
            echo "Checking global gateway setup..."
            sudo docker network inspect gateway >/dev/null 2>&1 || sudo docker network create gateway
            
            sudo mkdir -p /opt/gateway
            cat << 'EOF' | sudo tee /opt/gateway/docker-compose.{{cookiecutter.environment}}.yml > /dev/null
            services:
              caddy:
                image: lucaslorentz/caddy-docker-proxy:alpine
                ports:
                  - "80:80"
                  - "443:443"
                environment:
                  - CADDY_INGRESS_NETWORKS=gateway
                networks:
                  - gateway
                volumes:
                  - /var/run/docker.sock:/var/run/docker.sock
                  - gateway_caddy_data:/data
                restart: unless-stopped

            networks:
              gateway:
                external: true

            volumes:
              gateway_caddy_data:
            EOF
            sudo docker compose -f /opt/gateway/docker-compose.{{cookiecutter.environment}}.yml up -d

            # Create host directories for static and media volumes to avoid Docker root permissions issues
            echo "Creating host directories for static and media files..."
            sudo mkdir -p /var/www/{{cookiecutter.project_slug}}-{{cookiecutter.environment}}/static
            sudo mkdir -p /var/www/{{cookiecutter.project_slug}}-{{cookiecutter.environment}}/media
            sudo chown -R $USER:www-data /var/www/{{cookiecutter.project_slug}}-{{cookiecutter.environment}}
            sudo chmod -R 775 /var/www/{{cookiecutter.project_slug}}-{{cookiecutter.environment}}

            # Ensure we can pull the image from Docker Hub
            echo "Logging in to Docker Hub on remote host"
            echo "{% raw %}${{ secrets.DOCKERHUB_TOKEN }}{% endraw %}" | docker login --username "{% raw %}${{ secrets.DOCKERHUB_USERNAME }}{% endraw %}" --password-stdin || true

            # Pull the latest Docker image(s)
            # docker compose will read .env.{{cookiecutter.project_slug}}.{{cookiecutter.environment}} for ${DOCKER_IMAGE} substitution
            sudo docker compose -p {{cookiecutter.project_slug | replace('-', '_')}}_{{cookiecutter.environment}} --env-file .env.{{cookiecutter.project_slug}}.{{cookiecutter.environment}} -f docker-compose.{{cookiecutter.environment}}.yml pull || docker compose -p {{cookiecutter.project_slug | replace('-', '_')}}_{{cookiecutter.environment}} --env-file .env.{{cookiecutter.project_slug}}.{{cookiecutter.environment}} -f docker-compose.{{cookiecutter.environment}}.yml pull || true

            # Start containers (will gracefully recreate only changed containers)
            sudo docker compose -p {{cookiecutter.project_slug | replace('-', '_')}}_{{cookiecutter.environment}} --env-file .env.{{cookiecutter.project_slug}}.{{cookiecutter.environment}} -f docker-compose.{{cookiecutter.environment}}.yml up -d --no-build || docker compose -p {{cookiecutter.project_slug | replace('-', '_')}}_{{cookiecutter.environment}} --env-file .env.{{cookiecutter.project_slug}}.{{cookiecutter.environment}} -f docker-compose.{{cookiecutter.environment}}.yml up -d --no-build

            # Wait a moment
            sleep 5

            {% if cookiecutter.framework == 'django' %}
            # Run migrations
            sudo docker compose -p {{cookiecutter.project_slug | replace('-', '_')}}_{{cookiecutter.environment}} --env-file .env.{{cookiecutter.project_slug}}.{{cookiecutter.environment}} -f docker-compose.{{cookiecutter.environment}}.yml exec -T web python manage.py migrate

            # Collect static files
            sudo docker compose -p {{cookiecutter.project_slug | replace('-', '_')}}_{{cookiecutter.environment}} --env-file .env.{{cookiecutter.project_slug}}.{{cookiecutter.environment}} -f docker-compose.{{cookiecutter.environment}}.yml exec -T web python manage.py collectstatic --noinput
            {% elif cookiecutter.framework == 'fastapi' %}
            # Optional: Run alembic migrations if they use it (uncomment if using Alembic)
            # sudo docker compose -p {{cookiecutter.project_slug | replace('-', '_')}}_{{cookiecutter.environment}} --env-file .env.{{cookiecutter.project_slug}}.{{cookiecutter.environment}} -f docker-compose.{{cookiecutter.environment}}.yml exec -T web alembic upgrade head || true
            {% endif %}

            # Add any custom deployment commands here (e.g. cache clearing, custom scripts)
            # sudo docker compose -p {{cookiecutter.project_slug | replace('-', '_')}}_{{cookiecutter.environment}} --env-file .env.{{cookiecutter.project_slug}}.{{cookiecutter.environment}} -f docker-compose.{{cookiecutter.environment}}.yml exec -T web python manage.py your_custom_command

            # Clean up unused images and logs
            sudo docker image prune -f
            sudo journalctl --vacuum-time=7d
            echo "Deployment completed"